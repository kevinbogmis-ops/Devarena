# ==========================================================================
# DEVARENA - DOCKER COMPOSE
# Application Node.js + Base de données PostgreSQL avec volume persistant
# ==========================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: devarena-db
    environment:
      POSTGRES_USER: devarena
      POSTGRES_PASSWORD: devarena
      POSTGRES_DB: devarena
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devarena -d devarena"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: devarena-app
    ports:
      # Port hôte configurable via DEVARENA_PORT (3300 par défaut car 3000 est
      # souvent occupé par open-webui sur cette machine)
      - "${DEVARENA_PORT:-3300}:3000"
    environment:
      DATABASE_URL: postgresql://devarena:devarena@db:5432/devarena
      # En prod public, restreindre les origines : CORS_ORIGIN="https://mondomaine"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Éditeur de questions (/admin.html) : définir un token pour l'activer,
      # sinon l'API admin répond 503. Ex : ADMIN_TOKEN="monsecret" docker compose up -d
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      # questions.json est la source de vérité : monté depuis l'hôte pour que
      # les modifications faites via l'éditeur survivent aux redémarrages
      # du conteneur et restent versionnables dans git
      - ./questions.json:/app/questions.json
      # Idem pour les labs « tape la commande », modifiables dans l'éditeur
      - ./commands.json:/app/commands.json
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Exposition HTTPS publique via Cloudflare Tunnel (profile "tunnel", inactif
  # par défaut). Aucun port à ouvrir sur la box, HTTPS et WebSockets gérés.
  #
  #   Mode éphémère (zéro config, URL aléatoire trycloudflare.com) :
  #     docker compose --profile tunnel up -d
  #     docker compose logs -f cloudflared   # récupérer l'URL https://...
  #
  #   Mode permanent (URL/domaine fixe, nécessite un compte Cloudflare) :
  #     1. Créer un tunnel sur https://one.dash.cloudflare.com → copier le token
  #     2. TUNNEL_TOKEN="xxxx" docker compose --profile tunnel-named up -d
  # --------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: devarena-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app
    restart: unless-stopped

  cloudflared-named:
    image: cloudflare/cloudflared:latest
    container_name: devarena-tunnel-named
    profiles: ["tunnel-named"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Labs pratiques DSOXLab (profils "lab" et "lab-docker", inactifs par défaut).
  # Terminal reproductible : dsoxlab + Terraform + catalogues en versions figées
  # (voir lab/Dockerfile). Totalement séparé de l'application : réseau "labnet"
  # isolé, aucun port publié, jamais exposé par le tunnel.
  #
  #   Labs "shell" (Terraform, Linux...) :
  #     docker compose --profile lab run --rm lab
  #
  #   Labs Docker (ajoute un moteur docker:dind PRIVILÉGIÉ, usage local) :
  #     docker compose --profile lab-docker run --rm lab-docker
  #     docker compose --profile lab-docker stop dind      # après la session
  #
  # Progression conservée dans le volume "labhome" (catalogues + scores).
  # --------------------------------------------------------------------------
  lab:
    build: ./lab
    image: devarena-lab:latest
    profiles: ["lab"]
    stdin_open: true
    tty: true
    volumes:
      - labhome:/home/student
    networks: [labnet]

  dind:
    image: docker:27.5.1-dind
    profiles: ["lab-docker"]
    # Requis par Docker-in-Docker : ce conteneur a des droits étendus sur la
    # machine. À n'utiliser qu'en local, jamais sur un serveur exposé.
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""   # API sans TLS, joignable uniquement depuis labnet
    command: ["--host=tcp://0.0.0.0:2375"]
    volumes:
      - dinddata:/var/lib/docker
    networks: [labnet]

  lab-docker:
    image: devarena-lab:latest
    build: ./lab
    profiles: ["lab-docker"]
    stdin_open: true
    tty: true
    # Partage le réseau du moteur : les ports publiés par les labs sont
    # joignables sur localhost, comme les tests DSOXLab l'attendent
    network_mode: "service:dind"
    environment:
      DOCKER_HOST: tcp://localhost:2375
    volumes:
      - labhome:/home/student
    depends_on:
      - dind

networks:
  labnet:

volumes:
  pgdata:
  labhome:
  dinddata:
